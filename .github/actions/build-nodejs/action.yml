name: Build Node.js SDK
description: Typecheck, test and build packages/nodejs. Run from the repository root after checkout.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm

    - name: Typecheck
      shell: bash
      run: pnpm --filter @natsuneko-laboratory/catalyst-sdk run typecheck

    - name: Test
      shell: bash
      run: pnpm --filter @natsuneko-laboratory/catalyst-sdk run test

    - name: Build
      shell: bash
      run: pnpm --filter @natsuneko-laboratory/catalyst-sdk run build
