name: Build Kotlin SDK
description: Build and test packages/kotlin with the Gradle wrapper. Run from the repository root after checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"

    # Also validates the committed Gradle wrapper jar.
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Build
      shell: bash
      working-directory: packages/kotlin
      run: ./gradlew build
