name: Build Kotlin SDK
description: Build and test packages/kotlin with the Gradle wrapper. Run from the repository root after checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"

    # Also validates the committed Gradle wrapper jar.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Build
      shell: bash
      working-directory: packages/kotlin
      run: ./gradlew build
