name: Build .NET SDK
description: Restore, build and test packages/dotnet. Run from the repository root after checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
      with:
        dotnet-version: "10.0.x"

    - name: Test
      shell: bash
      working-directory: packages/dotnet
      run: dotnet test
