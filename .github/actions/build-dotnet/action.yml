name: Build .NET SDK
description: Restore, build and test packages/dotnet. Run from the repository root after checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: "10.0.x"

    - name: Test
      shell: bash
      working-directory: packages/dotnet
      run: dotnet test
