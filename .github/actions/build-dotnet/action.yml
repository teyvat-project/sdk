name: Build .NET SDK
description: Restore, build and test packages/dotnet. Run from the repository root after checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: "10.0.x"

    - name: Test
      shell: bash
      working-directory: packages/dotnet
      run: dotnet test
