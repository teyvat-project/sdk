name: Monitor OpenAPI

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions: {}

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.spec.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history and tags: next-version.mjs reads `git tag -l`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Fetch OpenAPI spec
        id: spec
        run: node scripts/spec.mjs https://api.natsuneko.com/openapi.json openapi/openapi.json >> "$GITHUB_OUTPUT"

      # Before anything is generated or pushed, so a bad info.version or an
      # already released stable version stops the run here.
      - name: Compute beta version
        id: version
        if: steps.spec.outputs.changed == 'true'
        run: |
          version=$(node scripts/next-version.mjs beta --spec openapi/openapi.json)
          echo "::notice title=Beta version::${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Regenerate clients
        if: steps.spec.outputs.changed == 'true'
        run: pnpm generate

      - name: Create regeneration patch
        if: steps.spec.outputs.changed == 'true'
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/regen.patch"
          mv "$RUNNER_TEMP/regen.patch" regen.patch

      - name: Upload regeneration patch
        if: steps.spec.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regen-patch
          path: regen.patch
          if-no-files-found: error

  build-nodejs:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Outside the workspace, so the artifact cannot overwrite checked-out files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen

      - name: Check regeneration patch paths
        run: node scripts/check-patch-paths.mjs "$RUNNER_TEMP/regen/regen.patch"

      - name: Apply regeneration patch
        run: git apply "$RUNNER_TEMP/regen/regen.patch"

      - uses: ./.github/actions/build-nodejs

  build-dotnet:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Outside the workspace, so the artifact cannot overwrite checked-out files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen

      - name: Check regeneration patch paths
        run: node scripts/check-patch-paths.mjs "$RUNNER_TEMP/regen/regen.patch"

      - name: Apply regeneration patch
        run: git apply "$RUNNER_TEMP/regen/regen.patch"

      - uses: ./.github/actions/build-dotnet

  build-kotlin:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Outside the workspace, so the artifact cannot overwrite checked-out files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen

      - name: Check regeneration patch paths
        run: node scripts/check-patch-paths.mjs "$RUNNER_TEMP/regen/regen.patch"

      - name: Apply regeneration patch
        run: git apply "$RUNNER_TEMP/regen/regen.patch"

      - uses: ./.github/actions/build-kotlin

  build-swift:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Outside the workspace, so the artifact cannot overwrite checked-out files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen

      - name: Check regeneration patch paths
        run: node scripts/check-patch-paths.mjs "$RUNNER_TEMP/regen/regen.patch"

      - name: Apply regeneration patch
        run: git apply "$RUNNER_TEMP/regen/regen.patch"

      - uses: ./.github/actions/build-swift

  commit:
    needs: [detect, build-nodejs, build-dotnet, build-kotlin, build-swift]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      # Credentials stay persisted on purpose: this job pushes to main.
      # No code from the patch runs in this job: the path check runs from the
      # unpatched checkout, and the version was computed in `detect`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          num='(0|[1-9][0-9]*)'
          if ! [[ "$VERSION" =~ ^${num}\.${num}\.${num}-beta\.[1-9][0-9]*$ ]]; then
            echo "::error::detect did not output a valid beta version"
            exit 1
          fi

      # Outside the workspace, so the artifact cannot overwrite checked-out files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen

      - name: Check regeneration patch paths
        run: node scripts/check-patch-paths.mjs "$RUNNER_TEMP/regen/regen.patch"

      - name: Apply regeneration patch
        run: |
          git apply "$RUNNER_TEMP/regen/regen.patch"
          git add -A -- openapi/openapi.json \
            packages/nodejs/src/generated \
            packages/swift/Generated \
            packages/dotnet/CatalystSharp/Generated \
            packages/kotlin/src/generated/kotlin

      - name: Commit and push
        run: |
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: regenerate SDKs from openapi ${VERSION%-beta.*}"
          git push origin HEAD:main

      - name: Dispatch beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching ${VERSION}"
          gh workflow run release.yml --ref main -f channel=beta -f version="$VERSION" -f sha="$(git rev-parse HEAD)"
